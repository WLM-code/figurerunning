/* Same sports-brand style as the app. Phone: map with a gallery strip at the bottom.
   Wide screens: gallery as a column on the left, map on the right. */
:root{
  --bg:#08111f; --panel:rgba(8,17,31,.95); --surface:#13233b; --surface-2:#1b3050; --line:rgba(255,255,255,.13);
  --text:#f3f6fb; --muted:#93a3bb; --accent:#ff5b2e; --warn:#ff5b5b;
  --disp:"Barlow Condensed","Arial Narrow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ui:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --dock-h:240px; color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{font-family:var(--ui);color:var(--text);background:var(--bg);-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit}
#map{position:fixed;inset:0;background:#dcdcd6}
.leaflet-tile-pane{filter:grayscale(1) contrast(.9) brightness(1.06)}
.leaflet-bottom{bottom:var(--dock-h)}
.leaflet-control-attribution{font:500 10px/1 var(--ui)!important;background:rgba(8,17,31,.8)!important;color:#cfd8e6!important;
  border-radius:999px;padding:4px 10px!important;margin:0 10px 10px 0!important}
.leaflet-control-attribution a{color:#cfd8e6!important;text-decoration:none}
.leaflet-bar{border:0!important;box-shadow:none!important;display:grid;gap:8px;margin:0 12px 6px 0!important}
.leaflet-bar a{width:44px!important;height:44px!important;line-height:40px!important;border:1px solid var(--line)!important;border-radius:50%!important;
  background:rgba(8,17,31,.9)!important;color:var(--text)!important;font:600 22px/42px var(--disp)!important;display:block;text-align:center;
  box-shadow:0 6px 18px rgba(0,0,0,.3)}
.leaflet-control-zoom{display:none}

.lanes{display:grid;gap:2px}
.lanes i{display:block;height:3px;background:var(--c)}

.top{position:fixed;top:0;left:0;right:0;z-index:1000;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;pointer-events:none}
.top>*{pointer-events:auto}
.top-l{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:9px;background:rgba(8,17,31,.84);color:var(--text);text-decoration:none;border:1px solid var(--line);
  border-radius:999px;padding:10px 15px;font:600 13px/1 var(--disp);letter-spacing:.1em;text-transform:uppercase;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 6px 18px rgba(0,0,0,.28);cursor:pointer}
.chip:active{transform:scale(.97)}
.chip svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none;margin:-1px 0}
@media(max-width:380px){#toapp span{display:none}#toapp{padding:10px 12px}}

.chip.brand{font:italic 800 16px/1 var(--disp);letter-spacing:.06em;cursor:pointer}
.chip.demo{border-color:var(--accent);color:var(--accent);cursor:default}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:1000;background:var(--panel);border-top:1px solid var(--line);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:26px 26px 0 0;
  padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 8px);display:grid;gap:6px;overflow:hidden;box-shadow:0 -10px 30px rgba(0,0,0,.3)}
.dl{display:none}
.dh{display:none;margin:0;font:italic 800 42px/.92 var(--disp);text-transform:uppercase}
.dsub{display:none;margin:0 0 8px;font:500 14px/1.4 var(--ui);color:var(--muted)}
.lab{display:flex;justify-content:space-between;align-items:center;gap:12px;font:600 12px/1 var(--disp);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.lab b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.strip{display:flex;gap:12px;overflow-x:auto;padding:8px 4px 12px;margin:0 -4px;scrollbar-width:none;min-height:0}
.strip::-webkit-scrollbar{display:none}

.gc{flex:none;width:136px;display:grid;gap:6px;align-content:start}
.gbtn{display:grid;gap:8px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:8px;cursor:pointer}
.gbtn:active{transform:scale(.98)}
.gbtn canvas{display:block;width:100%;aspect-ratio:1;border-radius:12px}
.meta{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:0 3px 3px}
.meta b{font:700 20px/1 var(--disp);letter-spacing:.01em;white-space:nowrap;font-variant-numeric:tabular-nums}
.meta small{font:600 11px/1 var(--disp);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.meta .by{font:600 13px/1.1 var(--disp);letter-spacing:.06em;color:var(--text);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gc.on .gbtn{border-color:var(--accent);background:var(--surface-2);box-shadow:0 0 0 1px var(--accent)}
.rm{border:1px solid rgba(255,91,91,.55);border-radius:999px;background:transparent;color:#ff8f8f;font:600 12px/1 var(--disp);letter-spacing:.14em;text-transform:uppercase;padding:9px 8px;cursor:pointer}
.rm.arm{background:var(--warn);border-color:var(--warn);color:#fff}

.msg{position:fixed;left:16px;right:16px;top:50%;transform:translateY(-62%);z-index:900;margin:auto;max-width:420px;background:var(--panel);
  border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 18px 44px rgba(0,0,0,.4)}
.msg .in{padding:20px 20px 22px;display:grid;gap:12px;justify-items:start}
.msg h2{margin:0;font:italic 800 clamp(30px,9vw,38px)/.95 var(--disp);text-transform:uppercase;text-wrap:balance}
.msg p{margin:0;font:500 15px/1.5 var(--ui);color:#cfd8e6}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 20px;border:0;border-radius:14px;
  background:var(--accent);color:#fff;font:italic 800 18px/1 var(--disp);letter-spacing:.04em;text-transform:uppercase;text-decoration:none;cursor:pointer}
.btn.alt{background:var(--surface);border:1px solid var(--line);color:var(--text)}
.btn:active{transform:scale(.97)}
.acts{display:flex;flex-wrap:wrap;gap:10px}
:focus-visible{outline:2px solid #5aa9ff;outline-offset:3px}

@media (min-width:900px){
  #map{left:380px}
  .top{left:380px}
  .msg{left:calc(380px + 16px)}
  .leaflet-control-zoom{display:grid}
  .leaflet-bottom{bottom:0}
  .dock{top:0;bottom:0;right:auto;width:380px;border-radius:0;border:0;border-right:1px solid var(--line);box-shadow:none;
    padding:0 18px 18px;grid-template-rows:auto auto auto auto minmax(0,1fr);align-content:start;gap:10px}
  .dl{display:grid;margin:0 -18px 14px;padding-top:env(safe-area-inset-top,0px)}
  .dh,.dsub{display:block}
  .strip{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;overflow-y:auto;overflow-x:hidden;align-content:start;padding:8px 4px 16px}
  .gc{width:auto}
  .meta{flex-direction:row;justify-content:space-between;align-items:baseline}
}
</style>
</head>
<body>
<div id="map"></div>

<div class="top">
  <div class="top-l"><button class="chip brand" id="brand" type="button" aria-label="Show all drawings">Figurerunning</button><span class="chip demo" id="demoChip" hidden>Demo</span></div>
  <div class="top-r"><a class="chip" id="toapp" href="./" aria-label="Back to drawing"><svg viewBox="0 0 24 24"><path d="M4 20l1-5L16.5 3.5a2.1 2.1 0 0 1 3 3L8 18z"/><path d="M14.5 5.5l3 3"/></svg><span>Draw</span></a></div>
</div>

<div class="msg" id="msg" hidden role="status">
  <div class="lanes"><i style="--c:#f2492b"></i><i style="--c:#ff9a2e"></i><i style="--c:#ffd21f"></i><i style="--c:#1fcb6b"></i><i style="--c:#2d8cff"></i><i style="--c:#8e5cf7"></i></div>
  <div class="in">
    <h2 id="msgT"></h2>
    <p id="msgP"></p>
    <div class="acts" id="msgA"></div>
  </div>
</div>

<div class="dock" id="dock" hidden>
  <div class="lanes dl"><i style="--c:#f2492b"></i><i style="--c:#ff9a2e"></i><i style="--c:#ffd21f"></i><i style="--c:#1fcb6b"></i><i style="--c:#2d8cff"></i><i style="--c:#8e5cf7"></i></div>
  <h1 class="dh">Figurerunning</h1>
  <p class="dsub">All art on one map</p>
  <div class="lab"><span>Drawings</span><b id="count">0</b></div>
  <div class="strip" id="strip" role="list"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="config.js"></script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const CFG = window.FR_CONFIG || {};
const CONFIGURED = !!(CFG.url && CFG.key);
const DEMO = /[?&]demo\b/.test(location.search);
const LIMIT = 300;                 // how many recent drawings we load
const PUBS = 'figurerunning.pubs.v1';
const COLORS = ['#f2492b','#ff9a2e','#ffd21f','#1fcb6b','#2d8cff','#8e5cf7','#ff5ba7','#111111'];
const wide = () => window.innerWidth >= 900;

let items = [], byId = {}, selId = null, lastLoad = 0, firstFit = true;

/* ---------- helpers ---------- */
const fmtKm = k => (+k).toFixed(k < 10 ? 2 : 1) + ' km';
const fmtDate = iso => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }); };
function own() { try { const v = JSON.parse(localStorage.getItem(PUBS) || '[]'); return Array.isArray(v) ? v : []; } catch (e) { return []; } }
function headers() { const h = { apikey: CFG.key }; if (CFG.key.startsWith('eyJ')) h.Authorization = 'Bearer ' + CFG.key; return h; }
function showMsg(title, text, acts) {
  $('#msgT').textContent = title; $('#msgP').textContent = text;
  const box = $('#msgA'); box.replaceChildren();
  for (const a of acts || []) {
    const el = document.createElement('a'); el.className = 'btn' + (a.alt ? ' alt' : ''); el.href = a.href; el.textContent = a.label;
    if (a.onclick) el.onclick = e => { e.preventDefault(); a.onclick(); };
    box.append(el);
  }
  $('#msg').hidden = false;
}
const hideMsg = () => { $('#msg').hidden = true; };

/* ---------- map ---------- */
const renderer = L.canvas({ padding: .5, tolerance: 9 });
const map = L.map('map', { zoomControl: false, attributionControl: false, renderer, minZoom: 2 }).setView([52.2, 5.3], 8);
L.control.attribution({ prefix: false, position: 'bottomright' }).addTo(map);
L.control.zoom({ position: 'bottomright', zoomInTitle: 'Zoom in', zoomOutTitle: 'Zoom out' }).addTo(map);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);
const hlGroup = L.layerGroup().addTo(map);       // glow under the selected drawing
const casings = L.layerGroup().addTo(map);       // dark outlines
const colors = L.layerGroup().addTo(map);        // coloured lines
const pins = L.layerGroup();                     // dots when zoomed far out
const PIN_ZOOM = 12;
function syncPins() {
  const on = map.getZoom() <= PIN_ZOOM;
  if (on && !map.hasLayer(pins)) pins.addTo(map);
  if (!on && map.hasLayer(pins)) map.removeLayer(pins);
}
map.on('zoomend', syncPins);
map.on('click', () => select(null));

const dock = $('#dock');
new ResizeObserver(() => {
  document.documentElement.style.setProperty('--dock-h', (dock.hidden || wide() ? 0 : dock.offsetHeight) + 'px');
}).observe(dock);
const padBottom = () => (wide() || dock.hidden ? 40 : dock.offsetHeight + 28);

/* ---------- drawings ---------- */
function valid(d) {
  if (!d || typeof d.id !== 'string' || !Array.isArray(d.segs)) return false;
  d.segs = d.segs.filter(s => s && Array.isArray(s.p) && s.p.length > 1 &&
    s.p.every(q => Array.isArray(q) && isFinite(q[0]) && isFinite(q[1])));
  d.segs.forEach(s => { if (!/^#[0-9a-f]{6}$/i.test(s.c || '')) s.c = '#111111'; });
  return d.segs.length > 0;
}
function bounds(d) {
  let a = 90, b = -90, c = 180, e = -180;
  for (const s of d.segs) for (const q of s.p) { if (q[0] < a) a = q[0]; if (q[0] > b) b = q[0]; if (q[1] < c) c = q[1]; if (q[1] > e) e = q[1]; }
  return L.latLngBounds([a, c], [b, e]);
}
function thumb(cv, segs) {                        // thumbnail without map: only the line, on a dark background
  const S = cv.width, ctx = cv.getContext('2d');
  ctx.fillStyle = '#0d1a2d'; ctx.fillRect(0, 0, S, S);
  let a = 90, b = -90, c = 180, e = -180;
  for (const s of segs) for (const q of s.p) { a = Math.min(a, q[0]); b = Math.max(b, q[0]); c = Math.min(c, q[1]); e = Math.max(e, q[1]); }
  const k = Math.cos((a + b) / 2 * Math.PI / 180);
  const w = Math.max((e - c) * 111320 * k, 30), h = Math.max((b - a) * 110540, 30);
  const sc = S * .74 / Math.max(w, h);
  const X = lo => S / 2 + (lo - (c + e) / 2) * 111320 * k * sc, Y = la => S / 2 - (la - (a + b) / 2) * 110540 * sc;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const pass of [0, 1]) for (const s of segs) {
    ctx.beginPath();
    s.p.forEach((q, i) => { i ? ctx.lineTo(X(q[1]), Y(q[0])) : ctx.moveTo(X(q[1]), Y(q[0])); });
    ctx.strokeStyle = pass ? s.c : 'rgba(255,255,255,.55)'; ctx.lineWidth = pass ? S / 70 : S / 70 + 2.5; ctx.stroke();
  }
}
function addItem(d) {
  d.bounds = bounds(d);
  const pick = () => select(d.id, 'map');
  const o = { renderer, lineCap: 'round', lineJoin: 'round', interactive: true, bubblingMouseEvents: false };
  d.layers = [];
  for (const s of d.segs) {
    const cas = L.polyline(s.p, { ...o, color: '#0b1626', weight: 9 }).on('click', pick); casings.addLayer(cas);
    const col = L.polyline(s.p, { ...o, color: s.c, weight: 6 }).on('click', pick); colors.addLayer(col);
    d.layers.push(cas, col);
  }
  d.pin = L.circleMarker([d.lat, d.lng], { renderer, radius: 8, color: '#0b1626', weight: 3, fillColor: d.segs[0].c, fillOpacity: 1, bubblingMouseEvents: false }).on('click', pick);
  pins.addLayer(d.pin);

  const card = document.createElement('div'); card.className = 'gc'; card.setAttribute('role', 'listitem');
  const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'gbtn';
  btn.setAttribute('aria-label', 'Drawing' + (d.artist ? ' by ' + d.artist : '') + ' of ' + fmtKm(d.km) + ' on ' + fmtDate(d.created_at));
  const cv = document.createElement('canvas'); cv.width = cv.height = 360; thumb(cv, d.segs);
  const meta = document.createElement('span'); meta.className = 'meta';
  const km = document.createElement('b'); km.textContent = fmtKm(d.km);
  const dt = document.createElement('small'); dt.textContent = fmtDate(d.created_at);
  meta.append(km, dt);
  if (d.artist) { const by = document.createElement('span'); by.className = 'by'; by.textContent = d.artist; meta.append(by); }
  btn.append(cv, meta); btn.onclick = () => select(d.id, 'card'); card.append(btn);
  const mine = own().find(p => p.id === d.id);
  if (mine) {
    const rm = document.createElement('button'); rm.type = 'button'; rm.className = 'rm'; rm.textContent = 'Remove'; rm.setAttribute('aria-label', 'Remove your drawing from the map');
    let armed = false;
    rm.onclick = async () => {
      if (!armed) { armed = true; rm.textContent = 'Are you sure?'; rm.classList.add('arm'); setTimeout(() => { armed = false; rm.textContent = 'Remove'; rm.classList.remove('arm'); }, 3000); return; }
      rm.disabled = true;
      try {
        const r = await fetch(CFG.url.replace(/\/$/, '') + '/rest/v1/rpc/unpublish_drawing', {
          method: 'POST', headers: { ...headers(), 'Content-Type': 'application/json' }, body: JSON.stringify({ p_id: d.id, p_secret: mine.secret })
        });
        if (!r.ok) throw new Error();
        localStorage.setItem(PUBS, JSON.stringify(own().filter(p => p.id !== d.id)));
        load(true);
      } catch (e) { rm.disabled = false; rm.textContent = 'Failed, try again'; }
    };
    card.append(rm);
  }
  d.card = card; $('#strip').append(card);
}
function clearAll() {
  casings.clearLayers(); colors.clearLayers(); pins.clearLayers(); hlGroup.clearLayers();
  $('#strip').replaceChildren(); items = []; byId = {};
}
function select(id, from) {
  hlGroup.clearLayers();
  document.querySelectorAll('.gc.on').forEach(el => el.classList.remove('on'));
  const d = id && byId[id]; selId = d ? id : null;
  if (!d) return;
  for (const s of d.segs) {
    const l = L.polyline(s.p, { renderer, color: '#ffbfa8', weight: 22, lineCap: 'round', lineJoin: 'round', interactive: false }).addTo(hlGroup);
    l.bringToBack();
  }
  d.card.classList.add('on');
  if (from !== 'quiet') {
    d.card.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
    map.fitBounds(d.bounds, { paddingTopLeft: [40, 90], paddingBottomRight: [40, padBottom()], maxZoom: 17 });
  }
}

function fitAll() {                               // overview of every drawing
  if (!items.length) return;
  const all = L.latLngBounds([]);                 // a fresh box, so no drawing's own bounds get stretched
  items.forEach(d => all.extend(d.bounds));
  map.fitBounds(all, { paddingTopLeft: [30, 90], paddingBottomRight: [30, padBottom()], maxZoom: 17 });
}
$('#brand').onclick = () => { select(null); fitAll(); };

/* ---------- loading ---------- */
function demoData() {
  const spots = [[52.3676, 4.9041], [52.0907, 5.1214], [51.9244, 4.4777], [52.0705, 4.3007], [51.4416, 5.4697], [53.2194, 6.5665],
                 [51.9851, 5.8987], [52.3874, 4.6462], [52.1601, 4.4970], [51.5719, 4.7683], [52.5160, 6.0830], [50.8503, 4.3517]];
  const shapes = [
    t => { const a = t * 2 * Math.PI; return [16 * Math.sin(a) ** 3, 13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a)].map(v => v / 17); },
    t => { const q = Math.floor(t * 10); const rr = q % 2 ? .42 : 1; const ang = q * Math.PI / 5 + (t * 10 - q) * Math.PI / 5; return [rr * Math.sin(ang), rr * Math.cos(ang)]; },
    t => { const a = t * 6 * Math.PI; return [t * Math.sin(a), t * Math.cos(a)]; },
    t => { const a = t * 2 * Math.PI, r = Math.cos(3 * a); return [r * Math.sin(a), r * Math.cos(a)]; },
    t => { const a = t * 2 * Math.PI; return [Math.sin(a), Math.sin(a) * Math.cos(a) * 1.4]; },
    t => { const a = t * 2 * Math.PI, r = 1 + .22 * Math.sin(6 * a); return [r * Math.sin(a), r * Math.cos(a)]; }
  ];
  return spots.map((c, i) => {
    const R = 260 + (i * 97) % 520, f = shapes[i % shapes.length], N = 150, k = Math.cos(c[0] * Math.PI / 180), pts = [];
    for (let j = 0; j <= N; j++) { const [x, y] = f(j / N); pts.push([+(c[0] + y * R / 110540).toFixed(5), +(c[1] + x * R / (111320 * k)).toFixed(5)]); }
    const parts = 2 + i % 3, segs = [];
    for (let q = 0; q < parts; q++) segs.push({ c: COLORS[(i + q * 2) % 7], p: pts.slice(Math.floor(q * N / parts), Math.floor((q + 1) * N / parts) + 1) });
    let m = 0; for (let j = 1; j < pts.length; j++) m += Math.hypot((pts[j][1] - pts[j - 1][1]) * 111320 * k, (pts[j][0] - pts[j - 1][0]) * 110540);
    return { id: 'demo-' + i, created_at: new Date(Date.now() - i * 86400000 * 1.7).toISOString(), segs, km: +(m / 1000).toFixed(2), lat: c[0], lng: c[1] };
  });
}
async function fetchDrawings() {
  const base = CFG.url.replace(/\/$/, '') + '/rest/v1/drawings?select=';
  const tail = '&order=created_at.desc&limit=' + LIMIT;
  let r = await fetch(base + 'id,created_at,segs,km,lat,lng,artist' + tail, { headers: headers() });
  if (r.status === 400) r = await fetch(base + 'id,created_at,segs,km,lat,lng' + tail, { headers: headers() });   // database not updated yet: no artist column
  if (!r.ok) throw new Error('error ' + r.status);
  return r.json();
}
async function load(quiet) {
  let list;
  if (DEMO) list = demoData();
  else if (!CONFIGURED) {
    showMsg('Not connected yet', 'Enter the details of your Supabase project in config.js. The steps are in SETUP.md. In the meantime you can view the demo.',
      [{ label: 'View the demo', href: '?demo' }, { label: 'Open the app', href: './', alt: true }]);
    return;
  } else {
    try { list = await fetchDrawings(); }
    catch (e) {
      if (!quiet) showMsg('Loading failed', 'The drawings could not be loaded. Check your connection and try again.', [{ label: 'Try again', href: '#', onclick: () => load() }]);
      return;
    }
  }
  lastLoad = Date.now();
  clearAll();
  for (const d of list) if (valid(d)) { items.push(d); byId[d.id] = d; addItem(d); }
  $('#demoChip').hidden = !DEMO;
  dock.hidden = !items.length;
  const total = items.reduce((a, d) => a + (+d.km || 0), 0);
  $('#count').textContent = items.length + (items.length >= LIMIT ? '+' : '') + ' · ' + fmtKm(total);
  syncPins();
  if (!items.length) {
    showMsg('No drawings yet', 'Make one in the app, tap Share and choose Put on the map.', [{ label: 'Open the app', href: './' }]);
    return;
  }
  hideMsg();
  if (selId && byId[selId]) select(selId, 'quiet');
  else if (firstFit) {
    firstFit = false;
    fitAll();
  }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && !DEMO && CONFIGURED && Date.now() - lastLoad > 60000) load(true);
});
load();
})();
</script>
</body>
</html>
